spring.application.name=helpdesk

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/helpdesk}
# Required. The API does not start when DB_USERNAME is missing.
spring.datasource.username=${DB_USERNAME}
# Required. The API does not start when DB_PASSWORD is missing.
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Required. The API does not start when JWT_SECRET is missing. Use at least 32 characters.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.admin.email=${ADMIN_EMAIL:admin@helpdesk.local}
# Required. The API does not start when ADMIN_PASSWORD is missing.
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME:Helpdesk Admin}
